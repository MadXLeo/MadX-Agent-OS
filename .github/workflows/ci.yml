name: CI

on:
  push:
    # The default branch does not yet expose workflow_dispatch. An authorized push of this
    # validation branch must run its own CI without merging or publishing an image.
    branches: [main, codex/linux-release-validation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r apps/desktop/test-requirements.txt
      - name: Fetch the pinned Hermes Agent snapshot
        run: npm run sync-upstream
      - run: npm ci
      - name: Verify centralized MadX product identity
        run: npm run branding:check
      - name: Audit product copy and documented compatibility exceptions
        run: node scripts/madx/audit-branding.mjs --check
      - run: npm run typecheck
      - name: Desktop tests with retained evidence
        run: npm run test --workspaces --if-present -- --reporter=default --reporter=junit --outputFile=desktop-tests.xml
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-tests-${{ runner.os }}
          path: apps/desktop/desktop-tests.xml

  bridge:
    name: Bridge plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r linux/tests/requirements.txt
      - name: Native test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cryptsetup-bin util-linux zip shellcheck openssh-client gnupg curl openssl
      - name: Require user namespaces for migration tests
        if: runner.os == 'Linux'
        run: |
          # Only this disposable GitHub runner: Ubuntu's AppArmor restriction otherwise skips
          # 25 root/user migration tests. Keep pytest unprivileged and prove the namespace works.
          if ! unshare -r true; then
            if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
          unshare -r sh -c 'test "$(id -u)" = 0'
      - name: Kickstart parser for real installer syntax checks
        run: python -m pip install pykickstart
      - name: pytest
        run: |
          HERALD_OS_PYTHON="$(command -v python)" bash scripts/test-bridge.sh \
            "$PWD/plugins/herald-os-bridge/tests" "$PWD/linux/tests" --junitxml="$PWD/bridge-linux-tests.xml"
      - name: Reject unexpected Linux skips
        if: always() && runner.os == 'Linux'
        run: python scripts/madx/check-junit.py bridge-linux-tests.xml --allow-skipped linux/tests/expected-linux-skips.json
      - name: Require real Linux alias filesystem tests
        if: runner.os == 'Linux'
        run: |
          python -m pytest linux/tests/test_branding.py -q --junitxml=alias-tests.xml
          python scripts/madx/check-junit.py alias-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-tests-${{ runner.os }}
          path: |
            bridge-linux-tests.xml
            alias-tests.xml

  hermes-runtime:
    name: Real Hermes runtime (no model provider)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the pinned runtime in an isolated environment
        run: |
          bash scripts/sync-upstream.sh
          python -m venv .venv/hermes-runtime
          .venv/hermes-runtime/bin/python -m pip install -e ./upstream/hermes-agent
          .venv/hermes-runtime/bin/python -m pip freeze >.venv/astra-hermes-dependencies.txt
      - name: Real process, authentication, bridge discovery and persistence
        run: .venv/hermes-runtime/bin/python scripts/madx/hermes-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-runtime-evidence
          path: |
            .venv/astra-hermes-runtime.json
            .venv/astra-hermes-dependencies.txt
            .venv/astra-runtime/*.log
          include-hidden-files: true

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse every bash and Python script
        run: |
          failed=0
          while IFS= read -r file; do
            case "$(head -n 1 "$file")" in
              '#!'*bash*) bash -n "$file" || failed=1 ;;
              '#!'*python*) python3 -m py_compile "$file" || failed=1 ;;
            esac
          done < <(git ls-files)
          exit "$failed"
      - name: Check MadX packaging inputs and compatibility aliases
        run: python3 scripts/madx/check-native.py

  signing:
    name: Signing policy
    runs-on: ubuntu-latest
    # Pull requests cannot read COSIGN_PRIVATE_KEY, so the repository variable SIGNING_ENABLED says
    # whether the image workflow signs; it and linux/image/cosign.pub must agree (#18).
    env:
      SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
    steps:
      - uses: actions/checkout@v7
      - name: cosign.pub and SIGNING_ENABLED agree
        run: |
          if [[ "$SIGNING_ENABLED" == "true" && ! -f linux/image/cosign.pub ]]; then
            # Expected while signing is being turned on (docs/LINUX.md): images are signed, not yet verified.
            echo "::warning::SIGNING_ENABLED is true but linux/image/cosign.pub is not committed yet: images are signed but machines do not verify them. Verify a signed image, then commit the public key."
          fi
          if [[ "$SIGNING_ENABLED" != "true" && -f linux/image/cosign.pub ]]; then
            echo "::error::linux/image/cosign.pub is committed but SIGNING_ENABLED is not true: set COSIGN_PRIVATE_KEY and SIGNING_ENABLED=true first, or the image build would ship an unsigned image that refuses its own updates."
            exit 1
          fi
          echo "Signing policy check passed (SIGNING_ENABLED=${SIGNING_ENABLED:-unset}, cosign.pub $([[ -f linux/image/cosign.pub ]] && echo present || echo absent))."

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/check-secrets.sh
